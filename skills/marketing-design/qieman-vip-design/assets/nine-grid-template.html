<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Qieman VIP Nine Grid</title>
<style>
  :root {
    --brand: #1B88EE;
    --navy: #0A1F3D;
    --black-blue: #0D1526;
    --navy-2: #122743;
    --gold: #C9A962;
    --soft-gold: #E8D5A3;
    --white: #FFFFFF;
    --text-2: #B8C5D6;
    --risk: #999999;
    --outer: 24px;
    --gap: 12px;
    --cell-pad: 26px;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1080px;
    margin: 0;
    overflow: hidden;
    background: var(--black-blue);
  }

  body {
    font-family: "Source Han Sans CN", "PingFang SC", system-ui, sans-serif;
  }

  #canvas {
    width: 1080px;
    height: 1080px;
    padding: var(--outer);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: var(--gap);
    background:
      radial-gradient(circle at 50% 38%, rgba(27,136,238,.11), transparent 38%),
      linear-gradient(145deg, #08172A 0%, #0D1526 58%, #091526 100%);
  }

  .card {
    position: relative;
    overflow: hidden;
    padding: var(--cell-pad);
    color: var(--white);
    background:
      linear-gradient(160deg, rgba(255,255,255,.028), transparent 42%),
      linear-gradient(150deg, #10233E 0%, #0B192D 64%, #091525 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.055),
      0 14px 36px rgba(0,0,0,.16);
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, transparent 58%, rgba(3,9,17,.48) 100%);
  }

  .card.center {
    background:
      radial-gradient(circle at 50% 42%, rgba(201,169,98,.14), transparent 34%),
      linear-gradient(145deg, #142C4B 0%, #0C1B31 62%, #081523 100%);
    box-shadow:
      inset 0 0 0 1px rgba(201,169,98,.34),
      0 18px 44px rgba(0,0,0,.24),
      0 0 32px rgba(201,169,98,.08);
  }

  .brand {
    position: relative;
    z-index: 4;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,.78);
    font-size: 13px;
    letter-spacing: .08em;
  }

  .brand::before {
    content: "";
    width: 7px;
    height: 7px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(201,169,98,.5);
  }

  .copy {
    position: absolute;
    z-index: 5;
    left: var(--cell-pad);
    right: var(--cell-pad);
    bottom: 24px;
  }

  .copy.right { text-align: right; }
  .copy.centered {
    top: 50%;
    bottom: auto;
    transform: translateY(-38%);
    text-align: center;
  }

  .title {
    margin: 0;
    font-family: "Source Han Serif CN", "Noto Serif SC", "Songti SC", serif;
    font-size: 31px;
    line-height: 1.24;
    font-weight: 700;
    letter-spacing: -.02em;
    text-wrap: balance;
    outline: none;
  }

  .center .title {
    font-size: 43px;
    line-height: 1.17;
    color: var(--soft-gold);
    font-weight: 900;
  }

  .subtitle {
    margin-top: 9px;
    color: var(--text-2);
    font-size: 18px;
    line-height: 1.42;
    font-weight: 400;
    text-wrap: balance;
    outline: none;
  }

  .accent-line {
    width: 42px;
    height: 1px;
    margin: 12px 0 0;
    background: linear-gradient(90deg, var(--gold), transparent);
  }

  .copy.right .accent-line { margin-left: auto; transform: scaleX(-1); }
  .copy.centered .accent-line { margin-left: auto; margin-right: auto; }

  .motif {
    position: absolute;
    z-index: 2;
    pointer-events: none;
  }

  /* 1 Signal */
  .motif.signal {
    width: 150px;
    height: 150px;
    right: 18px;
    top: 18px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,213,163,.95) 0 3%, rgba(201,169,98,.24) 4% 13%, rgba(201,169,98,.06) 14% 34%, transparent 35%);
    filter: drop-shadow(0 0 18px rgba(201,169,98,.34));
  }
  .motif.signal::before {
    content: "";
    position: absolute;
    inset: 28px;
    border: 1px solid rgba(201,169,98,.24);
    border-radius: 50%;
  }

  /* 2 Rings */
  .motif.rings {
    width: 168px;
    height: 168px;
    left: 12px;
    top: 18px;
    border: 1px solid rgba(201,169,98,.32);
    border-radius: 50%;
    box-shadow:
      0 0 0 24px rgba(201,169,98,.07),
      0 0 0 48px rgba(27,136,238,.055);
  }
  .motif.rings::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    right: 18px;
    top: 31px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 18px rgba(201,169,98,.7);
  }

  /* 3 Door */
  .motif.door {
    width: 92px;
    height: 150px;
    right: 34px;
    top: 24px;
    border: 1px solid rgba(201,169,98,.48);
    background: linear-gradient(90deg, rgba(201,169,98,.04), rgba(201,169,98,.16));
    box-shadow: inset 17px 0 22px rgba(201,169,98,.07), 8px 0 24px rgba(201,169,98,.08);
    transform: perspective(260px) rotateY(-12deg);
  }
  .motif.door::before {
    content: "";
    position: absolute;
    width: 3px;
    top: 0;
    bottom: 0;
    left: -6px;
    background: linear-gradient(180deg, transparent, var(--gold), transparent);
    filter: blur(.2px);
    box-shadow: 0 0 18px rgba(201,169,98,.76);
  }
  .motif.door::after {
    content: "";
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    right: 10px;
    top: 73px;
    background: var(--soft-gold);
  }

  /* 4 Nodes */
  .motif.nodes {
    width: 172px;
    height: 120px;
    right: 14px;
    top: 25px;
    opacity: .95;
    background-image: radial-gradient(circle, rgba(184,197,214,.22) 0 2px, transparent 2.5px);
    background-size: 24px 24px;
  }
  .motif.nodes::before {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    left: 47px;
    top: 27px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 52px 24px 0 var(--gold), 84px 65px 0 var(--soft-gold), 0 0 18px rgba(201,169,98,.6);
  }
  .motif.nodes::after {
    content: "";
    position: absolute;
    width: 96px;
    height: 1px;
    left: 52px;
    top: 34px;
    background: linear-gradient(18deg, var(--gold), rgba(201,169,98,.12));
    transform: rotate(26deg);
    transform-origin: left;
  }

  /* 5 Center halo */
  .motif.halo {
    width: 220px;
    height: 220px;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    border: 1px solid rgba(201,169,98,.18);
    box-shadow: 0 0 0 22px rgba(201,169,98,.038), 0 0 0 52px rgba(27,136,238,.025);
  }

  /* 6 Prism */
  .motif.prism {
    width: 0;
    height: 0;
    left: 34px;
    top: 31px;
    border-left: 58px solid transparent;
    border-right: 58px solid transparent;
    border-bottom: 102px solid rgba(201,169,98,.10);
    filter: drop-shadow(0 0 16px rgba(201,169,98,.16));
  }
  .motif.prism::before {
    content: "";
    position: absolute;
    width: 118px;
    height: 1px;
    left: -58px;
    top: 102px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transform: rotate(-60deg);
    transform-origin: center;
  }

  /* 7 Path */
  .motif.path {
    width: 186px;
    height: 120px;
    right: 14px;
    top: 25px;
    border-radius: 50%;
    border-top: 2px solid rgba(201,169,98,.56);
    transform: rotate(-18deg);
    box-shadow: 0 -5px 18px rgba(201,169,98,.12);
  }
  .motif.path::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    right: 6px;
    top: -5px;
    background: var(--soft-gold);
    box-shadow: 0 0 18px rgba(201,169,98,.72);
  }

  /* 8 Chess */
  .motif.chess {
    width: 62px;
    height: 106px;
    left: 64px;
    top: 25px;
    background: linear-gradient(180deg, var(--soft-gold), #AE8F50);
    border-radius: 35px 35px 12px 12px;
    filter: drop-shadow(0 18px 18px rgba(0,0,0,.32));
    clip-path: polygon(30% 0,70% 0,78% 16%,68% 33%,82% 60%,96% 82%,100% 100%,0 100%,4% 82%,18% 60%,32% 33%,22% 16%);
  }
  .motif.chess::after {
    content: "";
    position: absolute;
    width: 148px;
    height: 92px;
    left: -42px;
    top: 34px;
    z-index: -1;
    background:
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 23px 23px;
    transform: skewX(-14deg);
  }

  /* 9 Closure */
  .motif.closure {
    width: 150px;
    height: 150px;
    right: 16px;
    top: 20px;
    border: 1px solid rgba(201,169,98,.22);
    border-radius: 50%;
  }
  .motif.closure::before {
    content: "";
    position: absolute;
    inset: 28px;
    border: 1px solid rgba(27,136,238,.34);
    border-radius: 50%;
  }
  .motif.closure::after {
    content: "";
    position: absolute;
    width: 52px;
    height: 1px;
    left: 49px;
    top: 74px;
    background: var(--gold);
    box-shadow: 0 0 14px rgba(201,169,98,.45);
  }

  .legal {
    margin-top: 9px;
    color: var(--risk);
    font-size: 11px;
    line-height: 1.35;
    letter-spacing: .02em;
    outline: none;
  }

  [contenteditable="true"]:focus {
    background: rgba(27,136,238,.12);
    box-shadow: 0 0 0 1px rgba(27,136,238,.35);
  }
</style>
</head>
<body>
<main id="canvas" aria-label="且慢高净值九宫格模板"></main>
<script>
  /*
   * 编辑下面的9条数据即可。
   * title：主标题
   * subtitle：副标题；没有可留空
   * motif：signal / rings / door / nodes / halo / prism / path / chess / closure
   * align：left / right / center
   * brand：是否显示品牌文字
   * legal：是否显示风险提示
   */
  const cards = [
    { title: "赚到第一个300万之后", subtitle: "你会发现，孤独才是常态", motif: "signal", align: "left", brand: true },
    { title: "身边能聊投资的人越来越少", subtitle: "不是没有朋友，是频率对不上了", motif: "rings", align: "right" },
    { title: "你需要的不是建议，是共鸣", subtitle: "和懂的人聊，一句顶一万句", motif: "door", align: "left" },
    { title: "财富越多，能说话的地方越少", subtitle: "朋友圈不敢发，饭局不敢聊", motif: "nodes", align: "left" },
    { title: "高净值投资交流圈", subtitle: "资产300万+准入｜与同频者深度对话", motif: "halo", align: "center", center: true },
    { title: "不用解释仓位为什么这么重", subtitle: "这里的人，听得懂你的逻辑", motif: "prism", align: "right" },
    { title: "财富是筛选器，不是炫耀品", subtitle: "门槛筛掉的是噪音，留下的是价值", motif: "path", align: "left" },
    { title: "一个人扛着决策的重量太久了", subtitle: "是时候找到你的同类", motif: "chess", align: "right" },
    { title: "你值得一个配得上你资产的圈子", subtitle: "席位有限，择人而入", motif: "closure", align: "left", legal: true }
  ];

  const canvas = document.getElementById("canvas");

  cards.forEach((item) => {
    const card = document.createElement("section");
    card.className = `card${item.center ? " center" : ""}`;

    if (item.brand) {
      const brand = document.createElement("div");
      brand.className = "brand";
      brand.textContent = "盈米基金｜且慢";
      card.appendChild(brand);
    }

    const motif = document.createElement("div");
    motif.className = `motif ${item.motif}`;
    card.appendChild(motif);

    const copy = document.createElement("div");
    copy.className = `copy${item.align === "right" ? " right" : ""}${item.align === "center" ? " centered" : ""}`;

    const title = document.createElement("h2");
    title.className = "title";
    title.contentEditable = "true";
    title.textContent = item.title;
    copy.appendChild(title);

    const line = document.createElement("div");
    line.className = "accent-line";
    copy.appendChild(line);

    if (item.subtitle) {
      const subtitle = document.createElement("div");
      subtitle.className = "subtitle";
      subtitle.contentEditable = "true";
      subtitle.textContent = item.subtitle;
      copy.appendChild(subtitle);
    }

    if (item.legal) {
      const legal = document.createElement("div");
      legal.className = "legal";
      legal.contentEditable = "true";
      legal.textContent = "安放财富 · 静待花开｜市场有风险，投资需谨慎";
      copy.appendChild(legal);
    }

    card.appendChild(copy);
    canvas.appendChild(card);
  });
</script>
</body>
</html>
