<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设计内容核查报告</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--line:#e5e7eb;--text:#182230;--muted:#667085;
  --p0:#e5484d;--p0bg:rgba(229,72,77,.14);
  --p1:#f59e0b;--p1bg:rgba(245,158,11,.14);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
button,input,select{font:inherit}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:20}
.title{font-weight:700}.meta{font-size:12px;color:var(--muted)}.spacer{flex:1}
.stat{font-size:12px;background:#f2f4f7;padding:6px 10px;border-radius:999px}
.layout{height:calc(100% - 64px);display:grid;grid-template-columns:minmax(480px,1fr) 420px}
.viewer{overflow:auto;padding:24px}
.canvas{position:relative;width:min(680px,100%);margin:0 auto;background:#fff;box-shadow:0 8px 30px rgba(16,24,40,.12)}
.canvas img{display:block;width:100%;height:auto}
.mark{position:absolute;border:3px solid var(--p0);background:var(--p0bg);border-radius:5px;cursor:pointer;z-index:4}
.mark.p1{border-color:var(--p1);background:var(--p1bg);border-style:dashed}
.mark.missing{border-style:dashed}
.mark span{position:absolute;right:-12px;top:-13px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--p0);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.mark.p1 span{background:var(--p1)}
.mark.active{animation:pulse .8s ease 2}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(229,72,77,.22)}}
.sidebar{background:#fff;border-left:1px solid var(--line);overflow:auto}
.controls{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px;z-index:8}
.search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px}
.filters{display:flex;gap:6px;margin-top:9px}
.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 9px;cursor:pointer}
.filter.active{background:#182230;color:#fff}
.issue-list{padding:12px}
.issue{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;cursor:pointer}
.issue.active{border-color:#98a2b3;box-shadow:0 4px 16px rgba(16,24,40,.10)}
.issue-head{display:flex;align-items:center;gap:7px}
.badge{color:#fff;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:700}
.badge.p0{background:var(--p0)}.badge.p1{background:var(--p1)}
.count{margin-left:auto;color:var(--muted);font-size:12px}
.dimension{font-size:12px;color:var(--muted);margin-top:6px}
.desc{font-size:13px;line-height:1.55;margin-top:8px}
.compare{font-size:12px;padding:7px 8px;border-radius:7px;margin-top:6px;line-height:1.45}
.compare b{display:inline-block;width:52px}
.source{background:#eefbf3;color:#067647}.target{background:#fff1f0;color:#b42318}.fix{background:#eff8ff;color:#175cd3}
.locations{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.loc{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 7px;font-size:11px;cursor:pointer}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
@media(max-width:960px){
  .layout{grid-template-columns:1fr;height:auto}
  .sidebar{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header class="topbar">
  <div>
    <div class="title" id="reportTitle">设计内容核查报告</div>
    <div class="meta" id="reportMeta"></div>
  </div>
  <div class="spacer"></div>
  <span class="stat" id="issueCount">问题 0</span>
  <span class="stat" id="markCount">标记 0</span>
</header>

<main class="layout">
  <section class="viewer">
    <div class="canvas" id="canvas"></div>
  </section>

  <aside class="sidebar">
    <div class="controls">
      <input class="search" id="search" placeholder="搜索编号、位置或文案">
      <div class="filters">
        <button class="filter active" data-filter="all">全部</button>
        <button class="filter" data-filter="P0">P0</button>
        <button class="filter" data-filter="P1">P1</button>
      </div>
    </div>
    <div class="issue-list" id="issueList"></div>
  </aside>
</main>

<script>
/*
替换为真实核查数据。
页面截图可使用 Base64 或相对路径。
坐标采用 0–1 归一化比例。
*/
const AUDIT_DATA = {
  meta:{
    project:"项目名称",
    source:"需求文档",
    target:"设计稿"
  },
  image:{
    src:"",
    alt:"待核查设计稿"
  },
  issues:[
    /*
    {
      id:"AUD-001",
      priority:"P0",
      dimension:"数据与数字",
      location:"第1屏 / 业绩卡片",
      sourceText:"13.25%",
      targetText:"12.38%",
      description:"年化收益率与需求文档不一致。",
      suggestedFix:"修改为13.25%。",
      occurrences:[
        {x:0.10,y:0.08,width:0.30,height:0.03,label:"第1处"}
      ]
    }
    */
  ]
};

const state={filter:"all",query:"",active:null};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function init(){
  $("#reportTitle").textContent=AUDIT_DATA.meta.project+" · 内容核查";
  $("#reportMeta").textContent=`Source：${AUDIT_DATA.meta.source} ｜ Target：${AUDIT_DATA.meta.target}`;
  renderCanvas();
  renderIssues();
  updateStats();

  $("#search").addEventListener("input",e=>{
    state.query=e.target.value.trim().toLowerCase();
    renderIssues();
    updateMarks();
  });

  document.querySelectorAll(".filter").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
      btn.classList.add("active");
      state.filter=btn.dataset.filter;
      renderIssues();
      updateMarks();
    });
  });
}

function renderCanvas(){
  const canvas=$("#canvas");
  canvas.innerHTML="";
  const img=document.createElement("img");
  img.src=AUDIT_DATA.image.src;
  img.alt=AUDIT_DATA.image.alt||"设计稿";
  canvas.appendChild(img);

  AUDIT_DATA.issues.forEach((issue,issueIndex)=>{
    (issue.occurrences||[]).forEach((occ,occIndex)=>{
      const mark=document.createElement("button");
      mark.className=`mark ${issue.priority.toLowerCase()} ${occ.type==="missing"?"missing":""}`;
      mark.dataset.issue=issue.id;
      mark.dataset.occ=String(occIndex);
      mark.style.left=(occ.x*100)+"%";
      mark.style.top=(occ.y*100)+"%";
      mark.style.width=(occ.width*100)+"%";
      mark.style.height=(occ.height*100)+"%";
      mark.innerHTML=`<span>${issueIndex+1}.${occIndex+1}</span>`;
      mark.title=issue.description;
      mark.addEventListener("click",()=>activate(issue.id,occIndex,true));
      canvas.appendChild(mark);
    });
  });
}

function visibleIssues(){
  return AUDIT_DATA.issues.filter(issue=>{
    if(state.filter!=="all"&&issue.priority!==state.filter)return false;
    const text=[issue.id,issue.dimension,issue.location,issue.sourceText,issue.targetText,issue.description,issue.suggestedFix].join(" ").toLowerCase();
    return !state.query||text.includes(state.query);
  });
}

function renderIssues(){
  const list=$("#issueList");
  const issues=visibleIssues();
  if(!issues.length){
    list.innerHTML='<div class="empty">没有符合条件的问题</div>';
    return;
  }
  list.innerHTML=issues.map(issue=>{
    const locations=(issue.occurrences||[]).map((occ,index)=>
      `<button class="loc" data-issue="${esc(issue.id)}" data-occ="${index}">${index+1}. ${esc(occ.label||"位置"+(index+1))}</button>`
    ).join("");
    return `<article class="issue ${state.active===issue.id?"active":""}" id="card-${esc(issue.id)}" data-id="${esc(issue.id)}">
      <div class="issue-head">
        <span class="badge ${issue.priority.toLowerCase()}">${esc(issue.priority)}</span>
        <b>${esc(issue.id)}</b>
        <span class="count">共 ${(issue.occurrences||[]).length} 处</span>
      </div>
      <div class="dimension">${esc(issue.dimension)} · ${esc(issue.location)}</div>
      <div class="desc">${esc(issue.description)}</div>
      <div class="compare source"><b>Source</b>${esc(issue.sourceText)}</div>
      <div class="compare target"><b>Target</b>${esc(issue.targetText)}</div>
      <div class="compare fix"><b>建议</b>${esc(issue.suggestedFix)}</div>
      <div class="locations">${locations}</div>
    </article>`;
  }).join("");

  list.querySelectorAll(".issue").forEach(card=>{
    card.addEventListener("click",e=>{
      if(e.target.classList.contains("loc"))return;
      const issue=AUDIT_DATA.issues.find(x=>x.id===card.dataset.id);
      if(issue?.occurrences?.length)activate(issue.id,0,false);
    });
  });

  list.querySelectorAll(".loc").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      activate(btn.dataset.issue,Number(btn.dataset.occ),false);
    });
  });
}

function activate(issueId,occIndex,fromMark){
  state.active=issueId;
  renderIssues();

  document.querySelectorAll(".mark").forEach(x=>x.classList.remove("active"));
  const mark=document.querySelector(`.mark[data-issue="${CSS.escape(issueId)}"][data-occ="${occIndex}"]`);
  if(mark){
    mark.classList.add("active");
    mark.scrollIntoView({behavior:"smooth",block:"center",inline:"center"});
  }

  if(fromMark){
    document.getElementById("card-"+issueId)?.scrollIntoView({behavior:"smooth",block:"center"});
  }
}

function updateMarks(){
  const visible=new Set(visibleIssues().map(x=>x.id));
  document.querySelectorAll(".mark").forEach(mark=>{
    mark.classList.toggle("hidden",!visible.has(mark.dataset.issue));
  });
}

function updateStats(){
  $("#issueCount").textContent=`问题 ${AUDIT_DATA.issues.length}`;
  const count=AUDIT_DATA.issues.reduce((sum,x)=>sum+(x.occurrences||[]).length,0);
  $("#markCount").textContent=`标记 ${count}`;
}

init();
</script>
</body>
</html>
